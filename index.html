<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE Counter Monitor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f4f6f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #222; font-size: 18px; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.2s; color: white; margin-top: 8px; }
        .btn:first-child { margin-top: 0; }
        .btn-connect { background: #4f46e5; }
        .btn-connect:hover { background: #4338ca; }
        .btn-connect:disabled { background: #cbd5e1; cursor: not-allowed; }
        .btn-disconnect { background: #ef4444; }
        .btn-disconnect:hover { background: #dc2626; }

        #deviceDisplay { display: none; background: #e0e7ff; padding: 12px; border-radius: 8px; border-left: 5px solid #4f46e5; margin-bottom: 12px; }
        .device-name { font-size: 16px; font-weight: bold; color: #1e1b4b; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-box { background: #f8fafc; border-radius: 8px; padding: 14px; text-align: center; }
        .stat-label { font-size: 12px; color: #64748b; margin-bottom: 4px; }
        .stat-value { font-size: 32px; font-weight: bold; color: #1e293b; font-family: monospace; }
        .stat-sub { font-size: 11px; color: #94a3b8; margin-top: 4px; min-height: 16px; }

        .quality-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: #334155; }
        .quality-bar-bg { background: #e2e8f0; border-radius: 999px; height: 14px; overflow: hidden; }
        .quality-bar-fill { height: 100%; border-radius: 999px; width: 0%; background: #22c55e; transition: width 0.4s, background 0.4s; }
        .quality-warning { color: #b45309; background: #fef3c7; border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-top: 10px; display: none; }

        #dataCard { display: none; }

        #status { padding: 12px; background: #0f172a; color: #38bdf8; border-radius: 6px; white-space: pre-line; font-family: monospace; font-size: 12px; max-height: 160px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="card">
        <h2>BLE 연결</h2>
        <div id="deviceDisplay">
            <div class="device-name" id="connectedName"></div>
        </div>
        <button class="btn btn-connect" id="connectBtn">블루투스 기기 찾기</button>
        <button class="btn btn-disconnect" id="disconnectBtn" style="display:none;">연결 해제</button>
    </div>

    <div class="card" id="dataCard">
        <h2>수신 카운터</h2>
        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-label">최신 값</div>
                <div class="stat-value" id="currentValue">-</div>
                <div class="stat-sub" id="receivedTime">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">수신 패킷</div>
                <div class="stat-value" id="totalReceived">0</div>
                <div class="stat-sub" id="missedCount">누락 0개</div>
            </div>
        </div>
        <div>
            <div class="quality-header">
                <span>통신 품질</span>
                <span id="qualityPct">-</span>
            </div>
            <div class="quality-bar-bg">
                <div class="quality-bar-fill" id="qualityFill"></div>
            </div>
            <div class="quality-warning" id="qualityWarning">패킷 누락이 감지됐습니다 — 통신 품질이 좋지 않습니다.</div>
        </div>
    </div>

    <div class="card" style="background:#1e293b;">
        <h3 style="color:white; margin-top:0; font-size:14px;">실시간 로그</h3>
        <div id="status">대기 중...</div>
    </div>

    <script>
        const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const CHAR_UUID    = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

        const connectBtn    = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const statusDiv     = document.getElementById('status');
        const deviceDisplay = document.getElementById('deviceDisplay');
        const connectedName = document.getElementById('connectedName');
        const dataCard      = document.getElementById('dataCard');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffer = null;
        fetch('weak.mp3')
            .then(r => r.arrayBuffer())
            .then(buf => audioCtx.decodeAudioData(buf))
            .then(decoded => { audioBuffer = decoded; })
            .catch(() => {});

        function playAlert() {
            if (!audioBuffer) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const src = audioCtx.createBufferSource();
            src.buffer = audioBuffer;
            src.connect(audioCtx.destination);
            src.start(0);
        }

        let device = null;
        let manualDisconnect = false;
        let expectedNext = -1;
        let totalReceived = 0;
        let totalMissed = 0;

        function log(msg) {
            const now = new Date().toLocaleTimeString('ko-KR', { hour12: false });
            statusDiv.innerText += `\n[${now}] ${msg}`;
            statusDiv.scrollTop = statusDiv.scrollHeight;
        }

        function updateQuality() {
            const totalExpected = totalReceived + totalMissed;
            if (totalExpected === 0) return;
            const pct = Math.round((totalReceived / totalExpected) * 100);
            document.getElementById('qualityPct').innerText = `${pct}%`;
            const fill = document.getElementById('qualityFill');
            fill.style.width = `${pct}%`;
            fill.style.background = pct >= 90 ? '#22c55e' : pct >= 70 ? '#f59e0b' : '#ef4444';
            document.getElementById('qualityWarning').style.display = pct < 90 ? 'block' : 'none';
            document.getElementById('missedCount').innerText = `누락 ${totalMissed}개`;
        }

        function handleNotification(event) {
            const counter = event.target.value.getUint32(0, true);
            const now = new Date().toLocaleTimeString('ko-KR', {
                hour12: false, hour: '2-digit', minute: '2-digit',
                second: '2-digit', fractionalSecondDigits: 2
            });

            if (expectedNext >= 0 && counter !== expectedNext) {
                const missed = counter - expectedNext;
                totalMissed += missed;
                log(`누락 감지: ${missed}개 (${expectedNext} ~ ${counter - 1})`);
            }
            expectedNext = counter + 1;
            totalReceived++;

            if (counter > 0 && counter % 100 === 0) {
                playAlert();
            }

            document.getElementById('currentValue').innerText = counter;
            document.getElementById('receivedTime').innerText = now;
            document.getElementById('totalReceived').innerText = totalReceived;
            updateQuality();
        }

        function showConnected(dev) {
            connectedName.innerText = dev.name || '이름 없는 장치';
            deviceDisplay.style.display = 'block';
            connectBtn.style.display = 'none';
            connectBtn.disabled = false;
            disconnectBtn.style.display = 'block';
            dataCard.style.display = 'block';
        }

        function showDisconnected() {
            deviceDisplay.style.display = 'none';
            disconnectBtn.style.display = 'none';
            connectBtn.style.display = 'block';
            connectBtn.disabled = false;
            dataCard.style.display = 'none';
            expectedNext = -1;
            totalReceived = 0;
            totalMissed = 0;
        }

        async function connectToDevice(dev) {
            device = dev;
            dev.removeEventListener('gattserverdisconnected', onDisconnected);
            dev.addEventListener('gattserverdisconnected', onDisconnected);

            const server = await dev.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            const characteristic = await service.getCharacteristic(CHAR_UUID);
            await characteristic.startNotifications();
            characteristic.addEventListener('characteristicvaluechanged', handleNotification);
            log('알림 구독 완료 — 카운터 수신 중');
            showConnected(dev);
        }

        function onDisconnected() {
            if (manualDisconnect) {
                log('연결을 해제했습니다.');
                manualDisconnect = false;
                showDisconnected();
                return;
            }
            log('연결이 끊어졌습니다. 재연결 시도 중...');
            setTimeout(async () => {
                try {
                    await connectToDevice(device);
                    log('재연결 성공');
                } catch {
                    log('재연결 실패 — 수동으로 다시 연결해 주세요.');
                    showDisconnected();
                }
            }, 1000);
        }

        // 페이지 로드 시 이전에 허가된 장치에 자동 재연결
        async function tryAutoReconnect() {
            if (!navigator.bluetooth?.getDevices) return;
            try {
                const devices = await navigator.bluetooth.getDevices();
                if (devices.length === 0) return;
                const saved = devices[0];
                log(`이전 장치 발견: ${saved.name || 'Unknown'} — 자동 재연결 중...`);
                connectBtn.disabled = true;
                await connectToDevice(saved);
            } catch {
                log('자동 재연결 실패 — 수동으로 연결해 주세요.');
                connectBtn.disabled = false;
            }
        }

        // 브라우저가 포그라운드로 돌아올 때 (페이지 리로드 없이 복귀한 경우)
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState !== 'visible') return;
            if (!device || device.gatt.connected) return;
            log('화면 복귀 — 재연결 시도 중...');
            try {
                await connectToDevice(device);
                log('재연결 성공');
            } catch {
                log('재연결 실패 — 수동으로 다시 연결해 주세요.');
                showDisconnected();
            }
        });

        connectBtn.addEventListener('click', async () => {
            statusDiv.innerText = '연결 시작...';
            connectBtn.disabled = true;
            try {
                const dev = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                log(`장치 선택: ${dev.name || 'Unknown'}`);
                await connectToDevice(dev);
            } catch (err) {
                log(`[오류] ${err.message}`);
                connectBtn.disabled = false;
            }
        });

        disconnectBtn.addEventListener('click', () => {
            if (device && device.gatt.connected) {
                manualDisconnect = true;
                device.gatt.disconnect();
            }
        });

        window.addEventListener('load', tryAutoReconnect);
    </script>
</body>
</html>
